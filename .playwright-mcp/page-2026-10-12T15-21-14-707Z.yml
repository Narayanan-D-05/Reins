          - heading "Cold start looks like fraud." [level=3] [ref=f22e232]
          - paragraph [ref=f22e233]: A brand-new, honest counterparty has zero settlement history, indistinguishable at first glance from a scam. The probation cap allows a small trial payment instead of an outright block, not a full fix.
        - generic [ref=f22e234]:
          - heading "Tier 2 is a vendor dependency, on purpose." [level=3] [ref=f22e235]
          - paragraph [ref=f22e236]: An external oracle is one company's server for that one check. It's opt-in and swappable, and never the only gate, but it isn't neutral the way Reins' own attestation is.
        - generic [ref=f22e237]:
          - heading "A compromised passkey still spends within its last policy." [level=3] [ref=f22e238]
          - paragraph [ref=f22e239]: Revocation stops a leaked key going forward. It doesn't undo what that key was already allowed to do before you pulled the reins.
        - generic [ref=f22e240]:
          - heading "Recovery after a bad payment clears isn't solved yet." [level=3] [ref=f22e241]
          - paragraph [ref=f22e242]: Reins prevents and reveals; it doesn't yet reverse. A flagged-payment hold is on the roadmap, not in this build.
